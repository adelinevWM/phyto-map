<!DOCTYPE html>
<!-- 
  # phyto-map
  Output: agol-esque interactive map
  First attempt: base map of cont. US that emphasizes Pennsylvania (prepared for national scale)
  Layer 1: USGS DS-801 Surface Soil Yttrium (0-5 cm depth) - 1-9x UCC Tiers (UCC = 21 ppm)
  Layer 2: PASDA PADEP Abandoned Mine Land Problem Areas (PA)
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pennsylvania Surface REE Interactive Map (2-Layer System)</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- FontAwesome Icons for AGOL-style buttons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; overflow: hidden; background-color: #f8f8f8; }
    #map { width: 100%; height: 100%; }
    
    /* TOP LEFT: Search Bar */
    .agol-search-container { position: absolute; top: 15px; left: 15px; z-index: 1000; display: flex; background: #ffffff; border-radius: 2px; box-shadow: 0 1px 4px rgba(0,0,0,0.3); width: 290px; height: 34px; border: 1px solid #d1d1d1; }
    .agol-search-input { border: none; padding: 0 10px; flex: 1; font-size: 13px; color: #323232; outline: none; }
    .agol-search-btn { background: #ffffff; border: none; border-left: 1px solid #ececec; width: 34px; height: 34px; cursor: pointer; color: #6e6e6e; }
    
    /* TOP RIGHT: Controls */
    .agol-top-right-stack { position: absolute; top: 15px; right: 15px; z-index: 1000; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
    .agol-btn-group { display: flex; flex-direction: column; background: #ffffff; box-shadow: 0 1px 4px rgba(0,0,0,0.3); border-radius: 2px; }
    .agol-btn { width: 34px; height: 34px; background: #ffffff; border: none; border-bottom: 1px solid #e0e0e0; color: #4c4c4c; font-size: 14px; cursor: pointer; }
    .agol-btn.active { background: #0079c1; color: #ffffff; }
    .agol-basemap-toggle { display: flex; align-items: center; gap: 8px; background: #ffffff; padding: 6px 10px; border-radius: 2px; box-shadow: 0 1px 4px rgba(0,0,0,0.3); cursor: pointer; font-size: 12px; font-weight: 600; color: #323232; }
    .basemap-swatch { width: 22px; height: 22px; border-radius: 2px; background: #2b2b2b; border: 1px solid #999; }
    
    /* LAYER PANEL */
    .agol-layer-panel { width: 320px; background: #ffffff; border-radius: 2px; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
    .agol-layer-panel.hidden { display: none; }
    .panel-header { background: #f8f8f8; padding: 10px 12px; font-size: 13px; font-weight: 600; border-bottom: 1px solid #e0e0e0; display: flex; justify-content: space-between; }
    .panel-close { background: none; border: none; cursor: pointer; }
    .panel-body { padding: 12px 14px; font-size: 12px; max-height: 80vh; overflow-y: auto; }
    .layer-item { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #eee; }
    .layer-title { font-weight: 600; color: #151515; display: block; }
    .layer-sub { font-size: 11px; color: #6e6e6e; }
    .legend-row { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: 11px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; border: 1px solid #222; }
    .legend-poly { width: 14px; height: 14px; background: rgba(142, 68, 173, 0.4); border: 2px solid #8e44ad; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="agol-search-container">
    <input type="text" id="searchInput" class="agol-search-input" placeholder="Find place in PA (e.g., Pittsburgh)..." />
    <button class="agol-search-btn" id="searchBtn"><i class="fa-solid fa-magnifying-glass"></i></button>
  </div>

  <div class="agol-top-right-stack">
    <div class="agol-btn-group">
      <button class="agol-btn" id="zoomInBtn"><i class="fa-solid fa-plus"></i></button>
      <button class="agol-btn" id="zoomOutBtn"><i class="fa-solid fa-minus"></i></button>
    </div>
    <div class="agol-btn-group">
      <button class="agol-btn" id="homeBtn"><i class="fa-solid fa-house"></i></button>
    </div>
    <div class="agol-basemap-toggle" id="basemapToggleBtn">
      <span class="basemap-swatch" id="basemapSwatch"></span>
      <span id="basemapLabel">Dark Gray Canvas</span>
    </div>
    <div class="agol-btn-group">
      <button class="agol-btn active" id="layerToggleBtn"><i class="fa-solid fa-layer-group"></i></button>
    </div>

    <!-- LAYER PANEL -->
    <div class="agol-layer-panel" id="layerPanel">
      <div class="panel-header"><span>Layers</span><button class="panel-close" id="closeLayerPanel"><i class="fa-solid fa-xmark"></i></button></div>
      <div class="panel-body">
        
        <!-- Layer 1: Soil Points -->
        <div class="layer-item">
          <input type="checkbox" id="toggleSoilLayer" checked />
          <div style="flex:1;">
            <label for="toggleSoilLayer" class="layer-title">Surface Soil Yttrium (0–5 cm)</label>
            <span class="layer-sub">USGS DS-801 | UCC Baseline = 21 ppm</span>
            <div style="margin-top:6px;">
              <div class="legend-row"><span class="legend-dot" style="background:#b0bec5;"></span><span>&lt; 1x UCC</span></div>
              <div class="legend-row"><span class="legend-dot" style="background:#fff59d;"></span><span>1x – 2x UCC</span></div>
              <div class="legend-row"><span class="legend-dot" style="background:#ffee58;"></span><span>2x – 3x UCC</span></div>
              <div class="legend-row"><span class="legend-dot" style="background:#ffca28;"></span><span>3x – 4x UCC</span></div>
              <div class="legend-row"><span class="legend-dot" style="background:#ffa726;"></span><span>4x – 5x UCC (PA Max: 4.8x)</span></div>
            </div>
            <select id="uccFilterSelect" style="width:100%; margin-top:8px; padding:2px;">
              <option value="0">Show All PA Samples</option>
              <option value="1">>= 1x UCC</option>
              <option value="2">>= 2x UCC</option>
              <option value="3">>= 3x UCC</option>
            </select>
          </div>
        </div>

        <!-- Layer 2: PASDA AML Polygons -->
        <div class="layer-item" style="border:none;">
          <input type="checkbox" id="toggleAmlLayer" checked />
          <div style="flex:1;">
            <label for="toggleAmlLayer" class="layer-title">Abandoned Mine Lands (AML)</label>
            <span class="layer-sub">PASDA PADEP Polygons</span>
            <div style="margin-top:6px;">
              <div class="legend-row"><span class="legend-poly"></span><span>Disturbed Surface Zone / Refuse</span></div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Leaflet JS & Esri Leaflet for National MapServers -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/esri-leaflet@3.0.10/dist/esri-leaflet.js"></script>

  <script>
    const PA_CENTER = [40.9, -77.75];
    const map = L.map('map', { center: PA_CENTER, zoom: 7, zoomControl: false });

    // Basemaps (Defaulting to Light Gray)
    const lightGrayBase = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}').addTo(map);
    const lightGrayLabels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}').addTo(map);
    
    const darkGrayBase = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}');
    const darkGrayLabels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}');

    let isDarkBasemap = false;
    let paBounds = null;
    let paBorderLayer = null;
    let maskLayer = null;

    // PA Spotlight Mask 
    fetch('https://raw.githubusercontent.com/PublicaMundi/MappingAPI/master/data/geojson/us-states.json')
      .then(response => response.json())
      .then(data => {
        const paFeature = data.features.find(f => f.properties.name === 'Pennsylvania');
        const worldOuterRing = [[-180, -90], [-180, 90], [180, 90], [180, -90], [-180, -90]];
        maskLayer = L.geoJSON({ type: "Feature", geometry: { type: "Polygon", coordinates: [worldOuterRing, paFeature.geometry.coordinates[0]] } }, { style: { fillColor: '#000000', fillOpacity: 0.5, stroke: false } }).addTo(map);
        paBorderLayer = L.geoJSON(paFeature, { style: { color: '#2c3e50', weight: 2, fillOpacity: 0 } }).addTo(map);
      });

    // LAYER 2: PASDA Abandoned Mine Land Polygons (Guaranteed PA data)
    const amlLayer = L.esri.featureLayer({
      url: 'https://mapservices.pasda.psu.edu/server/rest/services/pasda/DEP/MapServer/1',
      simplifyFactor: 0.5,
      precision: 5,
      style: function () {
        return { color: '#8e44ad', weight: 1, fillOpacity: 0.5 };
      }
    }).bindPopup(function (layer) {
      return `<b>Abandoned Mine Land (AML)</b><br><b>Name:</b> ${layer.feature.properties.NAME || 'N/A'}`;
    }).addTo(map);

    // LAYER 1: Embedded USGS Soil Data
    const paSoilRecords = [
      { labId: "C-329064", siteId: "1468", lat: 39.8829, lng: -75.7595, y_ppm: 81.9, landCover: "Planted" },
      { labId: "C-329065", siteId: "252", lat: 40.1828, lng: -75.7392, y_ppm: 58.4, landCover: "Forest" },
      { labId: "C-329070", siteId: "12220", lat: 40.4941, lng: -75.6521, y_ppm: 46.8, landCover: "Planted" },
      { labId: "C-329082", siteId: "5052", lat: 41.3062, lng: -77.6669, y_ppm: 36.1, landCover: "Forest" },
      { labId: "C-329095", siteId: "4348", lat: 39.9869, lng: -75.3877, y_ppm: 34.5, landCover: "Planted" },
      { labId: "C-329110", siteId: "2700", lat: 41.2534, lng: -77.4521, y_ppm: 24.5, landCover: "Forest" }
    ].map(r => ({ ...r, ucc: r.y_ppm / 21.0 }));

    const soilLayerGroup = L.layerGroup().addTo(map);
    function renderSoilPoints(minUcc) {
      soilLayerGroup.clearLayers();
      paSoilRecords.forEach(row => {
        if (row.ucc >= minUcc) {
          L.circleMarker([row.lat, row.lng], {
            radius: row.ucc >= 3 ? 9 : 7,
            fillColor: row.ucc >= 4 ? '#ffa726' : row.ucc >= 3 ? '#ffca28' : row.ucc >= 2 ? '#ffee58' : row.ucc >= 1 ? '#fff59d' : '#b0bec5',
            color: '#1a1a1a', weight: 1.5, fillOpacity: 0.95
          }).bindPopup(`<b>PA Surface Soil</b><br>Yttrium: ${row.y_ppm} ppm<br>UCC Enrichment: ${row.ucc.toFixed(2)}x`).addTo(soilLayerGroup);
        }
      });
    }
    renderSoilPoints(0);

    // Toggle Handlers
    document.getElementById('toggleSoilLayer').addEventListener('change', (e) => e.target.checked ? map.addLayer(soilLayerGroup) : map.removeLayer(soilLayerGroup));
    document.getElementById('toggleAmlLayer').addEventListener('change', (e) => e.target.checked ? map.addLayer(amlLayer) : map.removeLayer(amlLayer));
    document.getElementById('uccFilterSelect').addEventListener('change', (e) => renderSoilPoints(parseFloat(e.target.value)));

    // Basemap Toggle Logic
    const basemapToggleBtn = document.getElementById('basemapToggleBtn');
    const basemapLabel = document.getElementById('basemapLabel');
    const basemapSwatch = document.getElementById('basemapSwatch');

    basemapToggleBtn.addEventListener('click', () => {
      if (!isDarkBasemap) {
        map.removeLayer(lightGrayBase);
        map.removeLayer(lightGrayLabels);
        darkGrayBase.addTo(map);
        darkGrayLabels.addTo(map);
        basemapLabel.textContent = 'Light Gray Canvas';
        basemapSwatch.style.background = '#e6e6e6';
        if (paBorderLayer) paBorderLayer.setStyle({ color: '#00b4d8' });
        if (maskLayer) maskLayer.setStyle({ fillColor: '#121212', fillOpacity: 0.7 });
      } else {
        map.removeLayer(darkGrayBase);
        map.removeLayer(darkGrayLabels);
        lightGrayBase.addTo(map);
        lightGrayLabels.addTo(map);
        basemapLabel.textContent = 'Dark Gray Canvas';
        basemapSwatch.style.background = '#2b2b2b';
        if (paBorderLayer) paBorderLayer.setStyle({ color: '#2c3e50' });
        if (maskLayer) maskLayer.setStyle({ fillColor: '#000000', fillOpacity: 0.5 });
      }
      isDarkBasemap = !isDarkBasemap;
    });

    // UI Buttons
    document.getElementById('layerToggleBtn').addEventListener('click', () => document.getElementById('layerPanel').classList.toggle('hidden'));
    document.getElementById('closeLayerPanel').addEventListener('click', () => document.getElementById('layerPanel').classList.add('hidden'));
    document.getElementById('zoomInBtn').addEventListener('click', () => map.zoomIn());
    document.getElementById('zoomOutBtn').addEventListener('click', () => map.zoomOut());
    document.getElementById('homeBtn').addEventListener('click', () => map.setView(PA_CENTER, 7));
  </script>
</body>
</html>
